name: keepalive
# Pings the Render API so a free instance doesn't spin down (it sleeps after ~15 min idle).
# Set the repo variable RENDER_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://xxxx.onrender.com
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.RENDER_URL }}/api/health"
