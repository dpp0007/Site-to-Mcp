[project]
name = "site-to-mcp"
version = "0.2.0"
description = "Turn websites with no API into typed MCP tools, powered by TinyFish Agent + Fetch."
requires-python = ">=3.11"
dependencies = ["tinyfish", "mcp[cli]>=1.2,<2", "pydantic>=2", "pyyaml", "uvicorn"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
site-to-mcp = "server:main"
site-to-mcp-health = "health_check:main_cli"
site-to-mcp-probe = "probe:main_cli"
s2m = "cli:main"

[tool.setuptools]
py-modules = ["server", "tf", "specs", "robots", "universal", "api", "keys", "cli", "mit_parsers", "nyc_parsers", "health_check", "probe"]
packages = ["sites"]

[tool.setuptools.package-data]
sites = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
